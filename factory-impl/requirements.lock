# requirements.lock — pinned dependency closure for factory-impl
#
# Method: the versions below are the exact distributions present in the verified
# environment (CPython 3.10.13) when `python3 -m pytest -q` last passed. They are
# the direct dependencies declared in pyproject.toml plus their installed
# transitive runtime closure, read via `importlib.metadata.version`.
#
# Reproduce / verify:
#   python3 - <<'PY'
#   from importlib.metadata import version
#   for line in open("requirements.lock"):
#       line = line.strip()
#       if not line or line.startswith("#"):
#           continue
#       name, _, want = line.partition("==")
#       assert version(name) == want, (name, version(name), want)
#   print("requirements.lock matches the installed environment")
#   PY
#
# This file pins versions; it does not by itself prove integrity. For a
# cryptographic lock, regenerate with `pip-compile --generate-hashes` against
# your index (network required) and pin the resulting hashes.

# KNOWN INCOMPATIBILITY (found 2026-10-16): typer 0.16.0 on click 8.5.0 does
# not enforce required options — a missing `--holder` arrives as None instead of
# failing. factory.cli works around it (`_enforce_required`, tested by
# tests/test_verification_fixes.py::test_cli_refuses_a_missing_required_option).
# Upgrading typer or pinning click to a version typer supports is an open
# decision; until then this lock records the environment as it is.

