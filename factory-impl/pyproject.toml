[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-impl"
version = "1.2.0"
description = "Template Factory — runnable implementation of the v1.2 specification"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "typer>=0.12",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
factory = "factory.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
